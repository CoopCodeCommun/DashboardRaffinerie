[tool.poetry]
name = "dashboardraffinerie"
version = "0.1.0"
description = "Dashboard pour la Raffinerie"
authors = ["Code Commun & La Raffinerie"]
license = "AGPLv3"
readme = "README.md"
#package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
django = "^4.2"
django-solo = "^2"
django-extensions = "^3"
werkzeug = "^3"
django-browser-reload = "^1.11.0"
djangorestframework = "^3"
markdown = "^3.4.4"
django-filter = "^24"
ipdb = "^0.13.13"
django-stdimage = "^6.0.1"
django-htmx = "^1.16.0"
faker = "^33"
django-tables2 = "^2.6.0"
requests = "^2"
cryptography = "^44"
stripe = "^11.4.1"
django-unfold = "^0.45.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
